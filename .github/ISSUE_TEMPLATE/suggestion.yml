name: Suggestion
description: Something you would like frun to do. Most suggestions are declined; read the rules first. English or 中文.
body:
  - type: markdown
    attributes:
      value: |
        Read [CONTRIBUTING.md](https://github.com/Nongfsq/frun/blob/main/CONTRIBUTING.md) first.
        frun opens programs and nothing else, with as few steps and words as possible, and stays small. Suggestions that work against that are closed.
  - type: textarea
    id: problem
    attributes:
      label: What you were trying to do
      description: The situation, not the solution. What did you open frun for, and what got in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you suggest
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I read CONTRIBUTING.md, including what frun will not do.
          required: true
        - label: I searched the open and closed issues and this was not suggested before.
          required: true
